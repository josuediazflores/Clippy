name: Clippy
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    # Device builds sign automatically. Simulator/CI scripts pass CODE_SIGNING_ALLOWED=NO on the command line.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 9UMCCFSYB9
    TARGETED_DEVICE_FAMILY: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  ClippyCore:
    path: Core
targets:
  Clippy:
    type: application
    platform: iOS
    sources:
      - App
      - path: ../../fixtures/ui
        buildPhase: resources
      - path: ../../contracts/schema.json
        buildPhase: resources
      - path: ../../contracts/transitions.json
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Clippy
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Scan the pairing code on your Clippy.
        CFBundleURLTypes:
          - CFBundleURLName: com.clippy.auth
            CFBundleURLSchemes: [clippy]
        # Development environment: account 666809320017, us-east-1 (ClippyData-dev / ClippyRuntime-dev). Empty hides cloud sign-in.
        ClippyAPIBaseURL: https://7oarnrv3b5.execute-api.us-east-1.amazonaws.com
        ClippyCognitoDomain: https://clippy-dev-666809320017.auth.us-east-1.amazoncognito.com
        ClippyCognitoClientID: 7ub8cudbpbk9pi2tg7859ful3t
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: com.clippy.local
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: ClippyCore
  ClippyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clippy.local.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Clippy
schemes:
  Clippy:
    build:
      targets:
        Clippy: all
    test:
      targets: [ClippyUITests]
